name: Windows portable build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate application startup
        run: python main.py --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/build.py
      - run: python -c "import subprocess; subprocess.run(['dist/MosaicRepair/MosaicRepair.exe', '--smoke-test'], check=True, timeout=30)"
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: MosaicRepair-Windows-x64
          path: dist/MosaicRepair
